<!DOCTYPE html>
<html lang="es">
<head>
    <title>Photo Thumbnails</title>
</head>
<body>
<div id="PhotoThumbsConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-toggle,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form id="PhotoThumbsConfigForm">
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label>
                        <input is="emby-toggle" type="checkbox" id="chkEnabled" />
                        <span>Plugin activo</span>
                    </label>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label>
                        <input is="emby-toggle" type="checkbox" id="chkOnlyMissing" />
                        <span>Solo carpetas sin portada</span>
                    </label>
                    <div class="fieldDescription checkboxFieldDescription">
                        Si se desmarca, se regeneran todas las portadas aunque ya tengan imagen.
                    </div>
                </div>

                <div class="inputContainer">
                    <label class="inputLabel" for="txtCollageMin">Mínimo de fotos para collage</label>
                    <input is="emby-input" type="number" id="txtCollageMin" min="2" max="4" step="1" />
                    <div class="fieldDescription">
                        Con menos fotos, la carpeta usa directamente la primera foto como portada.
                    </div>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label>
                        <input is="emby-toggle" type="checkbox" id="chkWarm" />
                        <span>Pre-generar miniaturas de cada foto</span>
                    </label>
                </div>

                <div class="inputContainer">
                    <label class="inputLabel" for="txtThumbSize">Tamaño de miniatura (px, lado mayor)</label>
                    <input is="emby-input" type="number" id="txtThumbSize" min="128" max="2048" step="16" />
                </div>

                <h3 class="checkboxListLabel">Bibliotecas donde actúa</h3>
                <div class="fieldDescription">
                    Solo carpetas/fotos dentro de estas bibliotecas.
                </div>
                <div id="libraryList" class="checkboxList paperList"
                     style="padding: .5em 1em 1em; margin: .5em 0;"></div>

                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block">
                        <span>Guardar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="text/javascript">
        var PhotoThumbsConfig = {
            pluginUniqueId: 'c62e1a4b-5f7d-4e9a-8b3c-6d2f9a1e7b05'
        };

        function renderLibraries(libraries, selected) {
            var container = document.querySelector('#libraryList');
            if (!libraries || libraries.length === 0) {
                container.innerHTML = '<div class="fieldDescription">'
                    + 'No se encontraron bibliotecas.</div>';
                return;
            }
            container.innerHTML = libraries.map(function (lib) {
                var checked = selected.indexOf(lib.Name) >= 0 ? ' checked' : '';
                var type = lib.CollectionType ? ' (' + lib.CollectionType + ')' : '';
                return '<div class="checkboxContainer">'
                    + '<label>'
                    + '<input is="emby-checkbox" type="checkbox" class="chkLibrary" '
                    + 'data-name="' + lib.Name + '"' + checked + ' />'
                    + '<span>' + lib.Name + type + '</span>'
                    + '</label></div>';
            }).join('');
        }

        function loadLibraries() {
            if (typeof ApiClient === 'undefined' || !ApiClient.getJSON) {
                return Promise.reject(new Error('ApiClient no disponible'));
            }
            return ApiClient.getJSON(ApiClient.getUrl('Library/VirtualFolders'))
                .then(null, function (err) {
                    var url = ApiClient.getUrl('Library/VirtualFolders');
                    if (typeof Dashboard !== 'undefined' && Dashboard.getCurrentUserId) {
                        url += '?userId=' + encodeURIComponent(Dashboard.getCurrentUserId());
                        return ApiClient.getJSON(url);
                    }
                    throw err;
                });
        }

        function initPage() {
            var page = document.querySelector('#PhotoThumbsConfigPage');
            if (!page) return;
            Dashboard.showLoadingMsg();
            Promise.all([
                ApiClient.getPluginConfiguration(PhotoThumbsConfig.pluginUniqueId),
                loadLibraries()
            ]).then(function (results) {
                var config = results[0];
                var libraries = results[1] || [];
                page.querySelector('#chkEnabled').checked = config.Enabled;
                page.querySelector('#chkOnlyMissing').checked = config.OnlyWhenMissingCover;
                page.querySelector('#txtCollageMin').value = config.CollageMinPhotos;
                page.querySelector('#chkWarm').checked = config.WarmThumbnails;
                page.querySelector('#txtThumbSize').value = config.ThumbSize;
                renderLibraries(libraries, config.TargetLibraries || []);
                Dashboard.hideLoadingMsg();
            }).catch(function (err) {
                Dashboard.hideLoadingMsg();
                var container = document.querySelector('#libraryList');
                if (container) {
                    container.innerHTML = '<div class="fieldDescription" style="color:#c33">'
                        + 'Error cargando bibliotecas: '
                        + (err && err.message ? err.message : err)
                        + '</div>';
                }
            });
        }

        (function () {
            var page = document.querySelector('#PhotoThumbsConfigPage');
            page.addEventListener('pageshow', initPage);
            page.addEventListener('viewshow', initPage);
            setTimeout(initPage, 500);
        })();

        document.querySelector('#PhotoThumbsConfigForm')
            .addEventListener('submit', function (e) {
                e.preventDefault();
                var page = this.closest('#PhotoThumbsConfigPage');
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(PhotoThumbsConfig.pluginUniqueId).then(function (config) {
                    config.Enabled = page.querySelector('#chkEnabled').checked;
                    config.OnlyWhenMissingCover = page.querySelector('#chkOnlyMissing').checked;
                    config.CollageMinPhotos = parseInt(page.querySelector('#txtCollageMin').value, 10) || 2;
                    config.WarmThumbnails = page.querySelector('#chkWarm').checked;
                    config.ThumbSize = parseInt(page.querySelector('#txtThumbSize').value, 10) || 480;
                    config.TargetLibraries = Array.prototype.slice
                        .call(page.querySelectorAll('.chkLibrary:checked'))
                        .map(function (c) { return c.getAttribute('data-name'); });
                    ApiClient.updatePluginConfiguration(
                        PhotoThumbsConfig.pluginUniqueId, config
                    ).then(Dashboard.processPluginConfigurationUpdateResult);
                });
                return false;
            });
    </script>
</div>
</body>
</html>
